id: hac.dcg.datainput
canonical: http://fhir.hac-poc.example/dcg
name: HACDiabetesCareGapsDataInput
title: "HAC Diabetes Care Gaps — Data Input Implementation Guide"
description: >-
  Profiles, terminology and a Bulk Data export contract that let a Canadian data
  provider (or a Synthea synthetic cohort) supply the FHIR R4 data needed to compute
  diabetes care-gap indicators for the Health Analytics Community FHIR Analytics PoC.
  Builds on CA Core+.
