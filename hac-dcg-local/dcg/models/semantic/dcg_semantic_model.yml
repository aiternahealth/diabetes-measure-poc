- name: a1c_at_target_rate
  label: Latest A1C at target (among tested)
  description: Among members with a valid HbA1c in 12 months, share whose latest value <= a1c_target_pct (default 7.0%).
  type: ratio
  type_params:
    numerator: a1c_at_target
    denominator: a1c_valid_result_12m
  config:
    meta:
      ontology_indicator: dcg:ind_a1c_at_target
      unit: proportion
      display_format: percent_1dp
      direction: higher_is_better
      denominator_measure: a1c_valid_result_12m
      numerator_measure: a1c_at_target
      min_cell_size: 5
      synonyms:
      - glycemic control
      - A1C control
      - at target
      - controlled diabetes
      - A1C under 7
      caveats:
      - Denominator is tested members only; untested people are not counted as controlled or uncontrolled. Pair with a1c_tested_12m_rate.
