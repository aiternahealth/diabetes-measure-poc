saved_queries:
- name: care_gap_scorecard
  description: Headline scorecard for the dashboard landing page.
  query_params:
    metrics:
    - cohort_size
    - a1c_tested_12m_rate
    - a1c_at_target_rate
    - bp_at_target_rate
    - kidney_screened_rate
    - eye_exam_rate
    - foot_exam_rate
    - statin_rate_40plus
    - any_gap_rate
    group_by:
    - TimeDimension('patient_period__period_end', 'day')
- name: gaps_by_age_sex
  description: Per-gap rates by age band and sex.
  query_params:
    metrics:
    - gap_a1c_test_rate
    - gap_a1c_control_rate
    - gap_bp_control_rate
    - gap_kidney_screen_rate
    - gap_lipid_test_rate
    - gap_eye_exam_rate
    - gap_foot_exam_rate
    - gap_statin_rate
    - gap_cardiorenal_rate
    group_by:
    - Dimension('patient_period__age_band')
    - Dimension('patient_period__sex')
- name: cohort_profile
  description: 'Profile of the diabetes cohort in one call: size, testing and control, BMI and BP levels, complications, medication classes and
    gaps. Group by age_band, sex, diabetes_type or bmi_category for distributions.'
  query_params:
    metrics:
    - cohort_size
    - a1c_tested_12m_rate
    - a1c_at_target_rate
    - a1c_latest_median_pct
    - bp_at_target_rate
    - bp_systolic_median_mmhg
    - bp_diastolic_median_mmhg
    - bmi_recorded_rate
    - bmi_latest_median_kg_m2
    - complication_rate
    - antihyperglycemic_rate
    - metformin_rate
    - insulin_rate
    - sglt2i_rate
    - glp1ra_rate
    - statin_rate_40plus
    - acei_arb_rate
    - any_gap_rate
    group_by: []
- name: dci_core_measures
  description: The DCI measure set M2-M10 as implemented in DCG (prevalence M1 is in the adult_population model). Equity stratification (M11)
    = group by a restricted equity dimension with the equity role.
  query_params:
    metrics:
    - a1c_tested_12m_rate
    - a1c_at_target_rate
    - a1c_poor_control_tested_rate
    - kidney_screened_rate
    - bp_at_target_measured_rate
    - statin_rate_40plus
    - eye_exam_rate
    - cardiorenal_agent_rate
    - acute_dm_admissions_per_1000
    group_by: []
- name: cohort_by_case_basis
  description: Cohort size and key rates by the evidence route that qualified each person (DM-ADULT-CASE).
  query_params:
    metrics:
    - cohort_size
    - a1c_tested_12m_rate
    - antihyperglycemic_rate
    - any_gap_rate
    group_by:
    - Dimension('patient_period__case_basis')
- name: data_quality_panel
  description: DQ metrics for the AI-Ready Data Quality case study.
  query_params:
    metrics:
    - dq_a1c_no_value_rate
    - dq_a1c_unit_rate
    - dq_a1c_implausible_rate
    - dq_missing_onset_rate
    - dq_dm_type_conflict_rate
    - dq_dm_duplicate_rate
    group_by:
    - Dimension('patient_period__data_source')
