# Diabetes Care Gaps — Semantic Model (dbt Semantic Layer / MetricFlow spec)
# Layer L3 of: FHIR Bulk $export -> SQL-on-FHIR views (L1) -> marts (L2) -> THIS (L3) -> agent contract (L4)
# Every measure sets create_metric: true, so ratio numerators/denominators resolve to same-named metrics.
# Every measure/metric carries config.meta.ontology* IRIs into ontology/dcg-ontology.ttl and
# synonyms used by the AI agent for intent resolution. Parameters live in dbt_project.yml vars.
# Generated by scripts/gen_semantic_model.py — edit the generator, then regenerate.
version: 2
semantic_models:
- name: adult_population
  description: Adults (>=18) alive at period end. Denominator for prevalence.
  model: ref('fct_adult_population_period')
  defaults:
    agg_time_dimension: period_end
  entities:
  - name: population_member
    type: primary
    expr: patient_id || '|' || cast(period_end as varchar)
  - name: patient
    type: foreign
    expr: patient_id
  dimensions:
  - name: period_end
    type: time
    type_params:
      time_granularity: day
    description: Measurement period end date (inclusive). All lookbacks are relative to it.
    config:
      meta:
        ontology: dcg:MeasurementPeriod
        synonyms:
        - as of
        - reporting period
        - year
        - quarter
  - name: age_band
    type: categorical
    description: 18-39 | 40-64 | 65+ (aligned to CPG statin age cut-point).
    config:
      meta:
        ontology: dcg:AgeBand
        synonyms:
        - age group
        - age
  - name: age_band_phac
    type: categorical
    description: 18-19 | 20-34 | 35-49 | 50-64 | 65-79 | 80+ (for comparison with PHAC-style age groups).
    config:
      meta:
        ontology: dcg:AgeBand
  - name: sex
    type: categorical
    description: FHIR administrative gender.
    config:
      meta:
        ontology: dcg:Sex
        synonyms:
        - gender
        - male/female
  - name: province
    type: categorical
    description: Province/territory from home address.
    config:
      meta:
        ontology: dcg:Province
        synonyms:
        - region
        - jurisdiction
        - PT
  - name: fsa
    type: categorical
    description: 'Forward sortation area. RESTRICTED: suppression required; never combine with both age_band and sex.'
    config:
      meta:
        ontology: dcg:ForwardSortationArea
        sensitivity: restricted
  - name: data_source
    type: categorical
    description: synthetic | real_world.
    config:
      meta:
        ontology: dcg:DataSource
  - name: case_basis
    type: categorical
    description: 'Strongest evidence route of case phenotype DM-ADULT-CASE: hospital_dx | ambulatory_2x | declared_condition | lab_a1c_2x (non-members:
      medication_only | none).'
    config:
      meta:
        ontology: dcg:CohortMembership
        synonyms:
        - case definition
        - evidence
        - why in cohort
        - how identified
  - name: phenotype_version
    type: categorical
    description: Version of the case phenotype that built the cohort (lineage).
    config:
      meta:
        ontology: dcg:CasePhenotype
  - name: service_language
    type: categorical
    description: 'Preferred service language (PCHDCF). RESTRICTED equity stratifier: equity role only, one at a time.'
    config:
      meta:
        ontology: dcg:ServiceLanguage
        sensitivity: restricted
        synonyms:
        - language
        - French
        - English
  - name: indigenous_identity
    type: categorical
    description: 'Indigenous identity (PCHDCF). RESTRICTED: equity role only; OCAP and community data governance apply.'
    config:
      meta:
        ontology: dcg:IndigenousIdentity
        sensitivity: restricted
  - name: racialized_group
    type: categorical
    description: 'Racialized group (PCHDCF). RESTRICTED equity stratifier: equity role only, one at a time.'
    config:
      meta:
        ontology: dcg:RacializedGroup
        sensitivity: restricted
  measures:
  - name: adults
    agg: sum
    expr: '1'
    description: Adults alive at period end.
    create_metric: true
    config:
      meta:
        ontology: dcg:Person
  - name: adults_with_diabetes
    agg: sum
    expr: has_diabetes
    description: Adults who meet case phenotype DM-ADULT-CASE.
    create_metric: true
    config:
      meta:
        ontology: dcg:DiabetesCohort
  - name: possible_cases_med_only
    agg: sum
    expr: possible_case_med_only
    description: Adults with antihyperglycemic medication but no qualifying diabetes evidence (not in the cohort; review for missing diagnoses).
    create_metric: true
    config:
      meta:
        ontology: dcg:route_medication
- name: diabetes_patient_period
  description: One row per diabetes-cohort member per period with care-process, outcome, gap and DQ flags.
  model: ref('fct_diabetes_patient_period')
  defaults:
    agg_time_dimension: period_end
  entities:
  - name: patient_period
    type: primary
    expr: patient_id || '|' || cast(period_end as varchar)
  - name: patient
    type: foreign
    expr: patient_id
  dimensions:
  - name: period_end
    type: time
    type_params:
      time_granularity: day
    description: Measurement period end date (inclusive). All lookbacks are relative to it.
    config:
      meta:
        ontology: dcg:MeasurementPeriod
        synonyms:
        - as of
        - reporting period
        - year
        - quarter
  - name: age_band
    type: categorical
    description: 18-39 | 40-64 | 65+ (aligned to CPG statin age cut-point).
    config:
      meta:
        ontology: dcg:AgeBand
        synonyms:
        - age group
        - age
  - name: age_band_phac
    type: categorical
    description: 18-19 | 20-34 | 35-49 | 50-64 | 65-79 | 80+ (for comparison with PHAC-style age groups).
    config:
      meta:
        ontology: dcg:AgeBand
  - name: sex
    type: categorical
    description: FHIR administrative gender.
    config:
      meta:
        ontology: dcg:Sex
        synonyms:
        - gender
        - male/female
  - name: province
    type: categorical
    description: Province/territory from home address.
    config:
      meta:
        ontology: dcg:Province
        synonyms:
        - region
        - jurisdiction
        - PT
  - name: fsa
    type: categorical
    description: 'Forward sortation area. RESTRICTED: suppression required; never combine with both age_band and sex.'
    config:
      meta:
        ontology: dcg:ForwardSortationArea
        sensitivity: restricted
  - name: data_source
    type: categorical
    description: synthetic | real_world.
    config:
      meta:
        ontology: dcg:DataSource
  - name: case_basis
    type: categorical
    description: 'Strongest evidence route of case phenotype DM-ADULT-CASE: hospital_dx | ambulatory_2x | declared_condition | lab_a1c_2x (non-members:
      medication_only | none).'
    config:
      meta:
        ontology: dcg:CohortMembership
        synonyms:
        - case definition
        - evidence
        - why in cohort
        - how identified
  - name: phenotype_version
    type: categorical
    description: Version of the case phenotype that built the cohort (lineage).
    config:
      meta:
        ontology: dcg:CasePhenotype
  - name: service_language
    type: categorical
    description: 'Preferred service language (PCHDCF). RESTRICTED equity stratifier: equity role only, one at a time.'
    config:
      meta:
        ontology: dcg:ServiceLanguage
        sensitivity: restricted
        synonyms:
        - language
        - French
        - English
  - name: indigenous_identity
    type: categorical
    description: 'Indigenous identity (PCHDCF). RESTRICTED: equity role only; OCAP and community data governance apply.'
    config:
      meta:
        ontology: dcg:IndigenousIdentity
        sensitivity: restricted
  - name: racialized_group
    type: categorical
    description: 'Racialized group (PCHDCF). RESTRICTED equity stratifier: equity role only, one at a time.'
    config:
      meta:
        ontology: dcg:RacializedGroup
        sensitivity: restricted
  - name: diabetes_type
    type: categorical
    description: 'Heuristic: type_1 (only type 1 evidence) | type_2 (only type 2) | other_specified (only secondary) | unclassified (mixed, unspecified
      or lab-only).'
    config:
      meta:
        ontology: dcg:DiabetesMellitus
        synonyms:
        - type
        - T1/T2
  - name: has_ckd_or_ascvd
    type: categorical
    expr: case when has_ckd_or_ascvd = 1 then 'yes' else 'no' end
    description: Chronic kidney disease (coded or 2 abnormal labs 90+ days apart) or atherosclerotic cardiovascular disease.
    config:
      meta:
        ontology: dcg:ChronicKidneyDisease
        synonyms:
        - CKD
        - ASCVD
        - cardio-renal
        - heart or kidney disease
  - name: diabetes_duration_band
    type: categorical
    expr: case when years_since_diagnosis < 5 then '<5y' when years_since_diagnosis < 10 then '5-9y' else '10y+' end
    description: Years since first diabetes diagnosis.
    config:
      meta:
        synonyms:
        - duration
        - years with diabetes
  - name: has_any_complication
    type: categorical
    expr: case when has_any_complication = 1 then 'yes' else 'no' end
    description: Any retinopathy, kidney disease, neuropathy or foot ulcer.
    config:
      meta:
        ontology: dcg:DiabetesComplication
  - name: therapy_profile
    type: categorical
    expr: case when on_insulin = 1 then 'insulin' when on_sglt2i_or_glp1ra = 1 then 'sglt2i_or_glp1ra' when on_antihyperglycemic = 1 then 'oral_other'
      else 'no_antihyperglycemic' end
    description: Hierarchical therapy grouping.
    config:
      meta:
        ontology: dcg:TherapyClass
        synonyms:
        - treatment
        - medication
  - name: bmi_category
    type: categorical
    expr: case when bmi_latest_value is null then 'not recorded' when bmi_latest_value < 18.5 then 'underweight (<18.5)' when bmi_latest_value
      < 25 then 'normal (18.5-24.9)' when bmi_latest_value < 30 then 'overweight (25-29.9)' else 'obese (30+)' end
    description: WHO adult BMI class of the latest BMI in 12 months; not recorded when there is none.
    config:
      meta:
        ontology: dcg:BMIResult
        synonyms:
        - BMI class
        - weight category
        - obesity
  - name: has_any_gap
    type: categorical
    expr: case when gap_count > 0 then 'yes' else 'no' end
    config:
      meta:
        ontology: dcg:CareGap
  measures:
  - name: cohort_members
    agg: sum
    expr: in_cohort
    description: People in the diabetes care-gap cohort.
    create_metric: true
    config:
      meta:
        ontology: dcg:DiabetesCohort
  - name: a1c_tested_recent
    agg: sum
    expr: a1c_tested_recent
    description: '>=1 HbA1c in recency window (default 6 months).'
    create_metric: true
    config:
      meta:
        ontology: dcg:cp_A1cTesting
  - name: a1c_tested_12m
    agg: sum
    expr: a1c_tested_12m
    description: '>=1 HbA1c in 12 months.'
    create_metric: true
    config:
      meta:
        ontology: dcg:HbA1cResult
  - name: a1c_valid_result_12m
    agg: sum
    expr: a1c_has_valid_result
    description: Has a valid (% unit, 3-20) HbA1c in 12 months.
    create_metric: true
    config:
      meta:
        ontology: dcg:HbA1cResult
  - name: a1c_at_target
    agg: sum
    expr: a1c_at_target
    description: Latest valid HbA1c <= target.
    create_metric: true
    config:
      meta:
        ontology: dcg:co_A1cAtTarget
  - name: a1c_poor_or_untested
    agg: sum
    expr: a1c_poor_or_untested
    description: Latest HbA1c > 9% or no valid result.
    create_metric: true
    config:
      meta:
        ontology: dcg:param_A1cPoorControl
  - name: a1c_poor_tested
    agg: sum
    expr: a1c_poor_tested
    description: Latest valid HbA1c > 9% (tested members only).
    create_metric: true
    config:
      meta:
        ontology: dcg:ind_a1c_poor_tested
  - name: a1c_unit_converted
    agg: sum
    expr: a1c_unit_converted
    description: Members whose HbA1c in 12 months arrived in mmol/mol and was converted to %.
    create_metric: true
    config:
      meta:
        ontology: dcg:UnitConversion
  - name: members_with_ckd
    agg: sum
    expr: has_ckd
    description: Members with CKD (coded, or 2 eGFR < 60 or ACR >= 3 mg/mmol 90+ days apart in 24 months).
    create_metric: true
    config:
      meta:
        ontology: dcg:ChronicKidneyDisease
  - name: members_with_ascvd
    agg: sum
    expr: has_ascvd
    description: Members with atherosclerotic cardiovascular disease.
    create_metric: true
    config:
      meta:
        ontology: dcg:AtheroscleroticCVD
  - name: members_ckd_or_ascvd
    agg: sum
    expr: has_ckd_or_ascvd
    description: Members with CKD or ASCVD (denominator of the cardio-renal measure).
    create_metric: true
    config:
      meta:
        ontology: dcg:ChronicKidneyDisease
  - name: ckd_or_ascvd_on_cardiorenal
    agg: sum
    expr: ckd_or_ascvd_on_cardiorenal
    description: Members with CKD or ASCVD on an SGLT2 inhibitor or GLP-1 RA.
    create_metric: true
    config:
      meta:
        ontology: dcg:CardiorenalAgent
  - name: acute_dm_admissions_12m
    agg: sum
    expr: acute_dm_admissions_12m
    description: Inpatient or emergency encounters with DKA or hypoglycemia in 12 months.
    create_metric: true
    config:
      meta:
        ontology: dcg:AcuteDiabetesEvent
  - name: a1c_latest_mean
    agg: average
    expr: a1c_latest_value
    description: Mean of latest valid HbA1c (%).
    create_metric: true
    config:
      meta:
        ontology: dcg:HbA1cResult
  - name: a1c_latest_median
    agg: median
    expr: a1c_latest_value
    description: Median of latest valid HbA1c (%).
    create_metric: true
    config:
      meta:
        ontology: dcg:HbA1cResult
  - name: bp_measured_12m
    agg: sum
    expr: bp_measured_12m
    description: BP measured in 12 months.
    create_metric: true
    config:
      meta:
        ontology: dcg:cp_BPMeasurement
  - name: bp_at_target
    agg: sum
    expr: bp_at_target
    description: Latest BP < 130/80.
    create_metric: true
    config:
      meta:
        ontology: dcg:co_BPAtTarget
  - name: kidney_screened_12m
    agg: sum
    expr: kidney_screened_12m
    description: eGFR and urine ACR in 12 months.
    create_metric: true
    config:
      meta:
        ontology: dcg:cp_KidneyScreening
  - name: lipid_tested_in_window
    agg: sum
    expr: lipid_tested_in_window
    description: LDL-C in lipid window (default 36 months).
    create_metric: true
    config:
      meta:
        ontology: dcg:cp_LipidTesting
  - name: eye_exam_in_window
    agg: sum
    expr: eye_exam_in_window
    description: Retinopathy screening in window (default 24 months).
    create_metric: true
    config:
      meta:
        ontology: dcg:cp_EyeExam
  - name: foot_exam_12m
    agg: sum
    expr: foot_exam_12m
    description: Foot exam in 12 months.
    create_metric: true
    config:
      meta:
        ontology: dcg:cp_FootExam
  - name: statin_eligible
    agg: sum
    expr: statin_eligible
    description: Cohort members aged >= statin_min_age.
    create_metric: true
    config:
      meta:
        ontology: dcg:param_StatinAge
  - name: statin_eligible_on_statin
    agg: sum
    expr: statin_eligible * on_statin
    description: Statin-eligible members with a statin.
    create_metric: true
    config:
      meta:
        ontology: dcg:cp_StatinTherapy
  - name: all_four_tests_12m
    agg: sum
    expr: all_four_tests_12m
    description: A1C, BP, LDL-C and kidney screening all in 12 months.
    create_metric: true
    config:
      meta:
        ontology: dcg:ind_all4
  - name: members_with_any_gap
    agg: sum
    expr: case when gap_count > 0 then 1 else 0 end
    description: Members with >=1 open gap.
    create_metric: true
    config:
      meta:
        ontology: dcg:CareGap
  - name: gap_count_total
    agg: sum
    expr: gap_count
    description: Total open gaps.
    create_metric: true
    config:
      meta:
        ontology: dcg:CareGap
  - name: members_with_complication
    agg: sum
    expr: has_any_complication
    description: Members with any complication.
    create_metric: true
    config:
      meta:
        ontology: dcg:DiabetesComplication
  - name: gap_a1c_test
    agg: sum
    expr: gap_a1c_test
    description: 'Open gap: a1c_test.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_a1c_test
  - name: gap_a1c_control
    agg: sum
    expr: gap_a1c_control
    description: 'Open gap: a1c_control.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_a1c_control
  - name: gap_bp_control
    agg: sum
    expr: gap_bp_control
    description: 'Open gap: bp_control.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_bp_control
  - name: gap_kidney_screen
    agg: sum
    expr: gap_kidney_screen
    description: 'Open gap: kidney_screen.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_kidney
  - name: gap_lipid_test
    agg: sum
    expr: gap_lipid_test
    description: 'Open gap: lipid_test.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_lipid
  - name: gap_eye_exam
    agg: sum
    expr: gap_eye_exam
    description: 'Open gap: eye_exam.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_eye
  - name: gap_foot_exam
    agg: sum
    expr: gap_foot_exam
    description: 'Open gap: foot_exam.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_foot
  - name: gap_statin
    agg: sum
    expr: gap_statin
    description: 'Open gap: statin.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_statin
  - name: gap_cardiorenal
    agg: sum
    expr: gap_cardiorenal
    description: 'Open gap: cardiorenal.'
    create_metric: true
    config:
      meta:
        ontology: dcg:gap_cardiorenal
  - name: dq_a1c_no_value
    agg: sum
    expr: dq_a1c_no_value
    description: HbA1c tests with no numeric result.
    create_metric: true
    config:
      meta:
        ontology: dcg:MissingValue
  - name: dq_a1c_unit
    agg: sum
    expr: dq_a1c_unit
    description: HbA1c results with non-% unit.
    create_metric: true
    config:
      meta:
        ontology: dcg:UnitNonConformance
  - name: dq_a1c_implausible
    agg: sum
    expr: dq_a1c_implausible
    description: HbA1c outside 3-20%.
    create_metric: true
    config:
      meta:
        ontology: dcg:ImplausibleValue
  - name: dq_missing_onset
    agg: sum
    expr: dq_missing_onset
    description: Diabetes Condition without onset date.
    create_metric: true
    config:
      meta:
        ontology: dcg:MissingValue
  - name: dq_dm_type_conflict
    agg: sum
    expr: dq_dm_type_conflict
    description: Both T1 and T2 coded.
    create_metric: true
    config:
      meta:
        ontology: dcg:UnmappedCode
  - name: dq_dm_duplicate
    agg: sum
    expr: dq_dm_duplicate
    description: Same qualifying diabetes code recorded on more than one Condition.
    create_metric: true
    config:
      meta:
        ontology: dcg:DuplicateRecord
  - name: bmi_recorded_12m
    agg: sum
    expr: bmi_recorded_12m
    description: Has a plausible BMI (10-80) in 12 months.
    create_metric: true
    config:
      meta:
        ontology: dcg:BMIResult
  - name: bmi_latest_mean
    agg: average
    expr: bmi_latest_value
    description: Mean of latest BMI (kg/m2) among those recorded.
    create_metric: true
    config:
      meta:
        ontology: dcg:BMIResult
  - name: bmi_latest_median
    agg: median
    expr: bmi_latest_value
    description: Median of latest BMI (kg/m2) among those recorded.
    create_metric: true
    config:
      meta:
        ontology: dcg:BMIResult
  - name: bp_systolic_latest_mean
    agg: average
    expr: bp_latest_systolic
    description: Mean of latest systolic BP (mmHg) among those measured.
    create_metric: true
    config:
      meta:
        ontology: dcg:BloodPressureReading
  - name: bp_systolic_latest_median
    agg: median
    expr: bp_latest_systolic
    description: Median of latest systolic BP (mmHg) among those measured.
    create_metric: true
    config:
      meta:
        ontology: dcg:BloodPressureReading
  - name: bp_diastolic_latest_mean
    agg: average
    expr: bp_latest_diastolic
    description: Mean of latest diastolic BP (mmHg) among those measured.
    create_metric: true
    config:
      meta:
        ontology: dcg:BloodPressureReading
  - name: bp_diastolic_latest_median
    agg: median
    expr: bp_latest_diastolic
    description: Median of latest diastolic BP (mmHg) among those measured.
    create_metric: true
    config:
      meta:
        ontology: dcg:BloodPressureReading
  - name: members_on_metformin
    agg: sum
    expr: on_metformin
    description: Members with a Metformin order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:Metformin
  - name: members_on_insulin
    agg: sum
    expr: on_insulin
    description: Members with a Insulin order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:Insulin
  - name: members_on_sglt2i
    agg: sum
    expr: on_sglt2i
    description: Members with a SGLT2 inhibitor order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:SGLT2Inhibitor
  - name: members_on_glp1ra
    agg: sum
    expr: on_glp1ra
    description: Members with a GLP-1 receptor agonist order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:GLP1ReceptorAgonist
  - name: members_on_dpp4i
    agg: sum
    expr: on_dpp4i
    description: Members with a DPP-4 inhibitor order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:DPP4Inhibitor
  - name: members_on_sulfonylurea
    agg: sum
    expr: on_sulfonylurea
    description: Members with a Sulfonylurea order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:Sulfonylurea
  - name: members_on_tzd
    agg: sum
    expr: on_tzd
    description: Members with a Thiazolidinedione order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:Thiazolidinedione
  - name: members_on_acei_arb
    agg: sum
    expr: on_acei_arb
    description: Members with a ACE inhibitor or ARB order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:ACEInhibitorOrARB
  - name: members_on_antihyperglycemic
    agg: sum
    expr: on_antihyperglycemic
    description: Members with a Any antihyperglycemic order or dispense in 12 months, or an active order.
    create_metric: true
    config:
      meta:
        ontology: dcg:AntihyperglycemicTherapy
metrics:
- name: cohort_size
  label: People with diabetes (cohort)
  description: Count of the diabetes care-gap cohort.
  type: simple
  type_params:
    measure: cohort_members
  config:
    meta:
      unit: persons
      synonyms:
      - how many people have diabetes
      - number of diabetics
      - cohort size
      - denominator
      min_cell_size: 5
- name: diabetes_prevalence_crude
  label: Diabetes prevalence (crude, adults)
  description: Adults with diabetes / adults alive at period end. Crude, not age-standardised.
  type: ratio
  type_params:
    numerator: adults_with_diabetes
    denominator: adults
  config:
    meta:
      ontology_indicator: dcg:ind_prevalence
      unit: proportion
      display_format: percent_1dp
      direction: context
      denominator_measure: adults
      numerator_measure: adults_with_diabetes
      min_cell_size: 5
      synonyms:
      - prevalence
      - percent with diabetes
      - how common is diabetes
      caveats:
      - Crude rate; PHAC CCDSS rates use an administrative case definition and age standardisation.
      - On synthetic data this reflects generator settings, not Canada.
      benchmark:
        ref: dcg:bm_phac_ccdss
        comparable: false
- name: a1c_tested_12m_rate
  label: A1C tested in past 12 months
  description: Share of cohort with >=1 HbA1c in the 12 months to period end.
  type: ratio
  type_params:
    numerator: a1c_tested_12m
    denominator: cohort_members
  config:
    meta:
      ontology_indicator: dcg:ind_a1c_tested_12m
      unit: proportion
      display_format: percent_1dp
      direction: higher_is_better
      denominator_measure: cohort_members
      numerator_measure: a1c_tested_12m
      min_cell_size: 5
      synonyms:
      - A1C testing rate
      - annual A1C
      - had A1C test this year
      - HbA1c screening
      caveats:
      - Benchmark is self-reported survey data (CCHS 2007), age-standardised.
      benchmark:
        ref: dcg:bm_cihi_2009_a1c12m
        value: 0.81
        comparable: directional only
- name: a1c_tested_recent_rate
  label: A1C tested in recency window
