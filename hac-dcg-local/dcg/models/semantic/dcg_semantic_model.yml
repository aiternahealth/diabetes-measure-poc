- name: cardiorenal_agent_rate
  label: SGLT2i or GLP-1 RA with CKD or ASCVD
  description: Among members with CKD or ASCVD, share with an SGLT2 inhibitor or GLP-1 receptor agonist order or dispense in 12 months (DCI M9).
  type: ratio
  type_params:
    numerator: ckd_or_ascvd_on_cardiorenal
    denominator: members_ckd_or_ascvd
  config:
    meta:
      ontology_indicator: dcg:ind_cardiorenal
      unit: proportion
      display_format: percent_1dp
      direction: higher_is_better
      denominator_measure: members_ckd_or_ascvd
      numerator_measure: ckd_or_ascvd_on_cardiorenal
      min_cell_size: 5
      synonyms:
      - cardio-renal protection
      - SGLT2 or GLP-1 for CKD
      - heart and kidney protection
      - cardiorenal agent
      caveats:
      - Tirzepatide counts as a GLP-1 RA by default (parameter tirzepatide_as_glp1ra).
      - Laboratory CKD needs 2 abnormal results 90+ days apart; single results do not count.
      value_sets:
      - vs_CKD
      - vs_KidneyDisease
      - vs_ASCVD
      - vs_eGFR
      - vs_UACR
      - vs_ATC_A10
- name: acute_dm_admissions_per_1000
  label: DKA or hypoglycemia admissions per 1,000
  type: derived
  description: Inpatient or emergency encounters with a DKA or hypoglycemia diagnosis in 12 months, per 1,000 cohort members (DCI M10; members
    approximate person-years for an annual period).
  type_params:
    expr: acute_dm_admissions_12m / cohort_members * 1000
    metrics:
    - name: acute_dm_admissions_12m
    - name: cohort_members
  config:
    meta:
      ontology_indicator: dcg:ind_acute_dm_hosp
      unit: per 1,000 members
      direction: lower_is_better
      min_cell_size: 5
      synonyms:
      - acute hospitalization
      - DKA admissions
      - hypoglycemia admissions
      - diabetic emergencies
      caveats:
      - Hypoglycemia counts only for cohort members; coding of DKA and hypoglycemia is incomplete in many sources.
      value_sets:
      - vs_DKA
      - vs_Hypoglycemia
- name: ckd_or_ascvd_rate
  label: CKD or ASCVD
  description: Share of cohort with chronic kidney disease or atherosclerotic cardiovascular disease.
  type: ratio
  type_params:
    numerator: members_ckd_or_ascvd
    denominator: cohort_members
  config:
    meta:
      unit: proportion
      display_format: percent_1dp
      direction: context
      denominator_measure: cohort_members
      numerator_measure: members_ckd_or_ascvd
      min_cell_size: 5
      synonyms:
      - comorbidity
      - CKD
      - ASCVD
      - cardiovascular disease
      value_sets:
      - vs_CKD
      - vs_KidneyDisease
      - vs_ASCVD
      - vs_eGFR
      - vs_UACR
- name: possible_case_rate
  label: Possible undiagnosed cases (medication only)
  description: Adults with antihyperglycemic medication but no qualifying diabetes evidence, per adult. Not in the cohort; a data-capture signal.
  type: ratio
  type_params:
    numerator: possible_cases_med_only
    denominator: adults
  config:
    meta:
      unit: proportion
      display_format: percent_1dp
      direction: context
      denominator_measure: adults
      numerator_measure: possible_cases_med_only
      min_cell_size: 5
      synonyms:
      - possible cases
      - missing diagnosis
      - medication without diagnosis
      caveats:
      - Metformin and GLP-1 RAs are also used for prediabetes, PCOS and weight management.
      value_sets:
      - vs_ATC_A10
